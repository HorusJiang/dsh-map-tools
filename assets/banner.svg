<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="dsh-map-tools — Map &amp; routing tools for DeepSeek Harness">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#0f1730"/>
      <stop offset="1" stop-color="#101a38"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2A6BE8"/>
      <stop offset="1" stop-color="#34C77B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.28" r="0.5">
      <stop offset="0" stop-color="#2A6BE8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2A6BE8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  <circle cx="980" cy="112" r="210" fill="url(#glow)"/>

  <!-- graticule (map grid) -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
    <line x1="1100" y1="0" x2="1100" y2="400"/>
    <line x1="600" y1="0" x2="1200" y2="0"/>
    <line x1="600" y1="100" x2="1200" y2="100"/>
    <line x1="600" y1="200" x2="1200" y2="200"/>
    <line x1="600" y1="300" x2="1200" y2="300"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.07" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10">
    <text x="605" y="18">116.39°E, 39.90°N</text>
    <text x="1005" y="318">121.47°E, 31.23°N</text>
  </g>

  <!-- route polyline: origin -> destination -->
  <g stroke="url(#route)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 660 296 L 718 258 L 706 214 L 762 178 L 812 198 L 868 152 L 930 168 L 986 116" opacity="0.35" stroke-width="10" filter="url(#soft)"/>
    <path d="M 660 296 L 718 258 L 706 214 L 762 178 L 812 198 L 868 152 L 930 168 L 986 116"/>
  </g>
  <!-- origin dot -->
  <circle cx="660" cy="296" r="9" fill="#34C77B"/>
  <circle cx="660" cy="296" r="4" fill="#0b1020"/>
  <!-- destination pin -->
  <g transform="translate(986 116)">
    <path d="M 0 -26 C -16 -8 -20 2 -20 10 a 20 20 0 0 0 40 0 C 20 2 16 -8 0 -26 Z" fill="#2A6BE8"/>
    <circle cx="0" cy="9" r="8" fill="#ffffff" fill-opacity="0.25"/>
    <circle cx="0" cy="9" r="3.6" fill="#ffffff"/>
  </g>

  <!-- title block -->
  <text x="64" y="142" fill="#E6EDF3" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="54" font-weight="700" letter-spacing="0.5">dsh-map-tools</text>
  <text x="66" y="182" fill="#8B949E" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20">Map &amp; routing tools for DeepSeek Harness — native, no MCP</text>

  <!-- tool chips -->
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">
    <g>
      <rect x="64" y="216" width="196" height="30" rx="15" fill="#2A6BE8" fill-opacity="0.16" stroke="#2A6BE8" stroke-opacity="0.45"/>
      <text x="162" y="236" fill="#79B8FF" text-anchor="middle">map_driving_route</text>
    </g>
    <g>
      <rect x="272" y="216" width="180" height="30" rx="15" fill="#34C77B" fill-opacity="0.14" stroke="#34C77B" stroke-opacity="0.4"/>
      <text x="362" y="236" fill="#7EE2B8" text-anchor="middle">map_geocode</text>
    </g>
    <g>
      <rect x="464" y="216" width="164" height="30" rx="15" fill="#2A6BE8" fill-opacity="0.16" stroke="#2A6BE8" stroke-opacity="0.45"/>
      <text x="546" y="236" fill="#79B8FF" text-anchor="middle">map_poi_search</text>
    </g>
    <g>
      <rect x="64" y="258" width="196" height="30" rx="15" fill="#34C77B" fill-opacity="0.14" stroke="#34C77B" stroke-opacity="0.4"/>
      <text x="162" y="278" fill="#7EE2B8" text-anchor="middle">map_transit_route</text>
    </g>
    <g>
      <rect x="272" y="258" width="192" height="30" rx="15" fill="#2A6BE8" fill-opacity="0.16" stroke="#2A6BE8" stroke-opacity="0.45"/>
      <text x="368" y="278" fill="#79B8FF" text-anchor="middle">map_bicycling_route</text>
    </g>
    <g>
      <rect x="476" y="258" width="148" height="30" rx="15" fill="#34C77B" fill-opacity="0.14" stroke="#34C77B" stroke-opacity="0.4"/>
      <text x="550" y="278" fill="#7EE2B8" text-anchor="middle">+ 2 more</text>
    </g>
  </g>

  <!-- footer tagline -->
  <text x="66" y="336" fill="#484F58" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14">Amap (高德) primary · OSM/OSRM fallback · 7 native tools · MIT</text>
</svg>
