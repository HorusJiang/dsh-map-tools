<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="dsh-map-tools — 太平湖远山 · Map &amp; routing tools for DeepSeek Harness">
  <defs>
    <linearGradient id="mask" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14100a" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#14100a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#14100a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sealGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D94A3A"/>
      <stop offset="1" stop-color="#A62E1F"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- ink-wash painting background -->
  <image href="inkwash-huguang.jpg" x="0" y="0" width="1200" height="400" preserveAspectRatio="xMidYMid slice"/>

  <!-- left readability mask -->
  <rect x="0" y="0" width="700" height="400" fill="url(#mask)"/>

  <!-- title block -->
  <text x="64" y="128" fill="#F2EDDF" font-family="Georgia, 'Songti SC', 'STSong', serif" font-size="54" font-weight="700" letter-spacing="1">dsh-map-tools</text>
  <text x="66" y="174" fill="#DDD3B8" font-family="'STKaiti','KaiTi','Noto Serif SC',serif" font-size="23">地图与路线规划 · 为 DeepSeek Harness 而生</text>
  <text x="66" y="208" fill="#D8CDB2" font-family="'STKaiti','KaiTi','Noto Serif SC',serif" font-size="14.5">驾车 · 公交 · 步行 · 骑行 · 地理编码 · POI 搜索</text>

  <!-- red seal (project chop) -->
  <g transform="translate(64 252)">
    <rect x="0" y="0" width="44" height="44" rx="4" fill="url(#sealGrad)"/>
    <text x="22" y="32" fill="#F5EFE0" font-family="'STKaiti','KaiTi','Noto Serif SC',serif" font-size="27" text-anchor="middle" font-weight="600">图</text>
  </g>
  <text x="122" y="281" fill="#C8B894" font-family="'STKaiti','KaiTi','Noto Serif SC',serif" font-size="14">湖山千里 · 一径相通</text>

  <!-- vermilion route stroke over the lake and mountains -->
  <g stroke="#C8402F" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 720 340 C 790 330 776 278 838 258 C 896 240 884 196 948 178 C 1004 162 1016 124 1082 110" opacity="0.26" stroke-width="11" filter="url(#blur)"/>
    <path d="M 720 340 C 790 330 776 278 838 258 C 896 240 884 196 948 178 C 1004 162 1016 124 1082 110" stroke-width="4.5"/>
  </g>
  <circle cx="720" cy="340" r="7" fill="#C8402F"/>
  <circle cx="720" cy="340" r="3" fill="#F2EDDF"/>
  <circle cx="1082" cy="110" r="5.5" fill="#C8402F"/>
  <circle cx="1082" cy="110" r="2.5" fill="#F2EDDF"/>

  <!-- colophon -->
  <text x="1110" y="388" fill="#4F4638" font-family="'STKaiti','KaiTi','Noto Serif SC',serif" font-size="14" text-anchor="end">丙午年 · 制图</text>
</svg>
